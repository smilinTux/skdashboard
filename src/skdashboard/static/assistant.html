<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SKDashboard — Assistant</title>
  <link rel="stylesheet" href="/static/css/board.css">
  <link rel="stylesheet" href="/static/css/assistant.css">
</head>
<body>
  <div class="wrap">
    <div class="topbar sidebar" role="navigation" aria-label="Dashboard sections">
      <div class="brand"><div class="glyph">SK</div><h1>SKDashboard</h1></div>
      <div class="tabs">
        <a class="tab" data-nav="home" href="/control-plane/now">Now</a>
        <a class="tab" data-nav="portfolio" href="/control-plane/portfolio?role=project-manager&amp;scope=estate&amp;window=latest&amp;baseline=none&amp;service=all">Portfolio</a>
        <a class="tab" data-nav="schedule" href="/control-plane/schedule?role=project-manager&amp;scope=estate&amp;window=latest&amp;baseline=none&amp;service=all&amp;lens=roadmap&amp;timezone=UTC">Schedule</a>
        <a class="tab" href="/matters">Matters</a>
        <a class="tab" href="/tasks">Tasks</a>
        <a class="tab" href="/work-queue">Work Queue</a>
        <a class="tab" href="/control-plane/reliability?role=operator&amp;scope=estate&amp;window=latest&amp;baseline=none&amp;service=all">Reliability</a>
        <a class="tab" href="/control-plane/architecture?role=architect&amp;scope=estate&amp;window=latest&amp;baseline=none&amp;service=all&amp;environment=all">Architecture</a>
        <a class="tab" href="/control-plane/ai?role=operator&amp;scope=estate&amp;window=latest&amp;baseline=none&amp;service=all">AI outcomes</a>
        <a class="tab" href="/control-plane/governance?role=governance&amp;scope=estate&amp;window=latest&amp;baseline=none&amp;service=all">Governance</a>
        <a class="tab" href="/control-plane/reports?role=project-manager&amp;scope=estate&amp;window=latest&amp;baseline=none&amp;service=all&amp;report_type=all">Reports</a>
        <a class="tab" data-nav="cockpit" href="/cockpit">ITIL Cockpit</a>
        <a class="tab" data-nav="cmdb" href="/cmdb">Assets (CMDB)</a>
        <a class="tab" data-nav="board" href="/board">Kanban Board</a>
        <a class="tab active" data-nav="assistant" href="/assistant">Assistant</a>
        <a class="tab" data-nav="trust" href="/trust">Trust</a>
        <a class="tab" data-nav="models" href="/models">Models</a>
        <a class="tab" data-nav="economy" href="/economy">Economy</a>
        <a class="tab" data-nav="fleet" href="/fleet">Fleet Drift</a>
      </div>
      <div class="spacer"></div>
      <span class="who mono">operator</span>
    </div>

    <div class="chat" id="chat">
      <div class="msg assistant">
        <div class="bubble">
          Ask me about the board and ITIL, or tell me to act on a ticket. For example:
          <div class="examples">
            <button class="ex">top 5 incidents by severity</button>
            <button class="ex">top 2 most-involved tasks</button>
            <button class="ex">summarize changes awaiting CAB</button>
            <button class="ex">which incidents are past SLA?</button>
          </div>
        </div>
      </div>
    </div>

    <form class="composer-bar" id="ask-form">
      <input type="text" id="ask" placeholder="Ask a report, or 'add a note to inc-… and queue lumina to draft the fix'…" autocomplete="off">
      <button class="btn primary" id="ask-send" type="submit">Ask</button>
    </form>
  </div>

  <script type="module" src="/static/js/assistant.js"></script>
</body>
</html>
