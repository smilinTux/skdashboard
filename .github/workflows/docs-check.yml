name: docs-check

# DOCS_FRESHNESS_STANDARD gate with changelog fragment support.
# Uses sk-standards reusable workflow for tiers 1 and 3, but handles tier 2
# (changelog) locally to accept changelog.d/ fragment files as satisfying the
# requirement. This prevents CHANGELOG.md collisions from blocking concurrent PRs.
on: [push, pull_request]

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch the validator from sk-standards
        uses: actions/checkout@v4
        with:
          repository: smilinTux/sk-standards
          ref: main
          path: .sk-standards
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect changed files (pull requests only)
        id: changed
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}" --depth=50 || true
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > /tmp/changed.txt || true
          echo "count=$(wc -l < /tmp/changed.txt)" >> "$GITHUB_OUTPUT"
          cat /tmp/changed.txt

      - name: Honour the changelog escape hatch
        id: hatch
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          used=no
          case "$TITLE" in *"[skip-changelog]"*) used=yes ;; esac
          case ",$LABELS," in *",docs-exempt,"*) used=yes ;; esac
          echo "used=$used" >> "$GITHUB_OUTPUT"
          if [ "$used" = "yes" ]; then
            echo "::warning title=changelog check waived::PR '$TITLE' waived the CHANGELOG requirement (labels: $LABELS)"
          fi

      - name: Run tier 1 (presence) and tier 3 (evidence) checks
        run: |
          set -euo pipefail
          python .sk-standards/scripts/docs_check.py --repo . --tier 1 --tier 3

      - name: Run tier 2 (changelog) check with fragment support
        if: github.event_name == 'pull_request' && steps.hatch.outputs.used != 'yes'
        run: |
          set -euo pipefail
          if [ ! -f /tmp/changed.txt ]; then
            echo "No changed files list, skipping changelog check"
            exit 0
          fi

          CODE_GLOBS=("src/" "pyproject.toml")
          touches_code=false
          while IFS= read -r f; do
            for glob in "${CODE_GLOBS[@]}"; do
              if [[ "$f" == "$glob"* ]]; then
                touches_code=true
                break 2
              fi
            done
          done < /tmp/changed.txt

          if [ "$touches_code" = false ]; then
            echo "ok: no code touched, changelog check n/a"
            exit 0
          fi

          # Check for either CHANGELOG.md edit or a valid changelog.d/ fragment.
          # A fragment must be a NEWLY ADDED file matching the towncrier naming
          # convention: changelog.d/<id>.<type>.md where <id> is a card or PR
          # identifier and <type> is one of the configured towncrier types.
          # A mere .gitkeep-only change, a directory rename, a deletion, or an
          # invalid suffix does not satisfy the requirement.
          BASE_REF="origin/${{ github.base_ref }}"
          ADDED="$(git diff --diff-filter=A --name-only "$BASE_REF...HEAD" | tr '\n' ' ')"
          DELETED="$(git diff --diff-filter=D --name-only "$BASE_REF...HEAD" | tr '\n' ' ')"
          CHANGED="$(tr '\n' ' ' < /tmp/changed.txt)"
          has_changelog=false
          has_fragment=false
          has_valid_fragment=false
          # Allowed towncrier fragment types (from [tool.towncrier] in pyproject.toml).
          FRAG_TYPES="added changed deprecated removed fixed security docs"
          for f in $CHANGED; do
            if [ "$f" = "CHANGELOG.md" ]; then
              has_changelog=true
            fi
            if [[ "$f" == changelog.d/* ]]; then
              has_fragment=true
            fi
          done
          for f in $CHANGED; do
            case "$f" in
              changelog.d/*)
                # The fragment only satisfies the requirement if it was ADDED
                # in this PR and not simultaneously deleted.
                added=false
                deleted=false
                for a in $ADDED; do
                  if [ "$a" = "$f" ]; then added=true; break; fi
                done
                for d_ in $DELETED; do
                  if [ "$d_" = "$f" ]; then deleted=true; break; fi
                done
                if [ "$added" = false ] || [ "$deleted" = true ]; then
                  continue
                fi
                base="${f##*/}"
                stem="${base%.md}"
                type="${stem##*.}"
                id="${stem%.*}"
                valid=false
                # A valid fragment is named <id>.<type>.md where <type> is one of
                # the configured towncrier types, and <id> is a card id (8-hex),
                # a PR number, or a bare number.
                case "$type" in
                  added|changed|deprecated|removed|fixed|security|docs)
                    if [[ "$id" =~ ^[0-9a-f]{8}$ ]] || [[ "$id" =~ ^pr?[0-9]+$ ]] || [[ "$id" =~ ^[0-9]+$ ]]; then
                      valid=true
                    fi
                    ;;
                esac
                if [ "$valid" = true ]; then
                  has_valid_fragment=true
                fi
                ;;
            esac
          done

          if [ "$has_changelog" = true ]; then
            echo "ok: code changed and CHANGELOG.md updated"
            exit 0
          fi

          if [ "$has_valid_fragment" = true ]; then
            echo "ok: code changed and a valid changelog.d/ fragment (id.type.md, added) satisfies the changelog requirement"
            exit 0
          fi
          if [ "$has_fragment" = true ]; then
            echo "::error::a file under changelog.d/ was added but its name does not match the required pattern changelog.d/<id>.<type>.md with a towncrier type (added, changed, deprecated, removed, fixed, security, docs)."
            echo "Rename it, e.g. to changelog.d/a45ad9d7.fixed.md"
            exit 1
          fi

          echo "::error::code under src/ or pyproject.toml changed but neither CHANGELOG.md nor a valid changelog.d/ fragment was added."
          echo "Add a fragment to changelog.d/ (e.g., card123.added.md) or use the docs-exempt label / [skip-changelog] for a genuinely trivial change."
          exit 1

      - name: Prove the gate can fail (negative control)
        run: python .sk-standards/scripts/docs_check.py --self-test
