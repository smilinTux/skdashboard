[build-system]
requires = ["setuptools>=68.0", "wheel", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "skdashboard"
dynamic = ["version"]
description = "SKWorld operator dashboard - coord board + ITIL + kanban + CMDB web UI/API (:7778)"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.10"
authors = [{name = "smilinTux", email = "admin@smilintux.org"}]
keywords = ["ai", "agent", "sovereign", "dashboard", "kanban", "itil"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "capauth>=0.3.9.dev50",
    "cryptography>=42",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "mcp>=1.0,<2.0",
    "PyJWT[crypto]>=2.8",
    "referencing>=0.35",
    "skcoord>=0.1.55",
    "skcapstone>=0.15.0",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.scripts]
skdashboard-read-only = "skdashboard.read_only:main"
skdashboard-control-plane-mcp = "skdashboard.control_plane_mcp:main"


[project.urls]
Homepage = "https://github.com/smilinTux/skdashboard"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skdashboard = ["static/**/*", "contracts/**/*.json", "*.html"]

[tool.ruff]
line-length = 99

[tool.towncrier]
name = "skdashboard"
directory = "changelog.d"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
underlines = ["~", "-", "^"]
title_format = "## [{version}] - {project_date}"
# issue_format omitted: we use card/PR identifiers in fragment content, not filenames
single_file = true
orphan_prefix = "+"

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true

[[tool.towncrier.type]]
directory = "docs"
name = "Documentation"
showcontent = true

[tool.towncrier.build]
url = "https://github.com/smilinTux/skdashboard"

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
